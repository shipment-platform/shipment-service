syntax = "proto3";

package com.danijelsudimac.shipmentservice.model.event;

option java_multiple_files = true;
option java_package = "com.danijelsudimac.shipmentservice.model.event";

import "model/common/shipment_status.proto";

message ShipmentUpdatedEvent {

  string idempotency_key = 1;

  int64 actual_delivery = 2;
  int64 actual_pickup = 3;

  int64 client_id = 4;

  int64 estimated_delivery = 5;
  int64 estimated_pickup = 6;

  int64 event_timestamp = 7;

  string external_id = 8;
  string order_id = 9;

  com.danijelsudimac.shipmentservice.model.common.ShipmentStatus status = 10;

  string tracking_number = 11;
}