receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: shipment-service
          scrape_interval: 30s
          metrics_path: /actuator/prometheus
          static_configs:
            - targets:
                - localhost:8080

exporters:
  prometheusremotewrite:
    endpoint: https://aps-workspaces.us-east-2.amazonaws.com/workspaces/ws-6cfa12e2-cbc7-46d4-a1a4-dec8cd15ebcd/api/v1/remote_write
    auth:
      authenticator: sigv4auth

extensions:
  sigv4auth:
    region: us-east-2
    service: aps

service:
  extensions: [sigv4auth]

  pipelines:
    metrics:
      receivers: [prometheus]
      exporters: [prometheusremotewrite]