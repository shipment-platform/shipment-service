receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: shipment-service
          scrape_interval: 30s
          metrics_path: /actuator/prometheus
          static_configs:
            - targets:
                - localhost:8080

exporters:
  prometheusremotewrite:
    endpoint: ${env:PROMETHEUS_URL}
    auth:
      authenticator: sigv4auth

extensions:
  sigv4auth:
    region: us-east-2
    service: aps

service:
  extensions: [sigv4auth]

  pipelines:
    metrics:
      receivers: [prometheus]
      exporters: [prometheusremotewrite]