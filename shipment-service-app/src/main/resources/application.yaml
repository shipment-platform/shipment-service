spring:
  application:
    name: shipment-service
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterAccess=60m
  flyway:
    locations: classpath:db/migration
management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    prometheus:
      enabled: true
    health:
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: shipment-service
  otlp:
    metrics:
      export:
        resource-attributes:
          service.name: ${spring.application.name}
application:
  kafka:
    shipment-topic: shipment-ingest-topic.v1
    producer:
      acks: all
      retries: 10
      properties:
        enable.idempotence: true

        linger.ms: 5
        batch.size: 65536
        compression.type: snappy

        request.timeout.ms: 30000
        delivery.timeout.ms: 60000
        retry.backoff.ms: 500
        max.in.flight.requests.per.connection: 5