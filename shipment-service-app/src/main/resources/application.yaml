spring:
  application:
    name: shipment-service
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterAccess=60m
  flyway:
    locations: classpath:db/migration
management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: "*"