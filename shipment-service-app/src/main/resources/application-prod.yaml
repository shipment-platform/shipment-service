spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      ssl:
        enabled: true
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
      username: redis-user
      password: ${SPRING_DATA_REDIS_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    baseline-on-migrate: true
  kafka:
    template:
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: com.amazonaws.services.schemaregistry.serializers.GlueSchemaRegistryKafkaSerializer
      acks: all
      retries: 10
      properties:
        region: us-east-2
        registry.name: shipment-platform-registry
        compatibility.setting: BACKWARD
        schemaAutoRegistrationEnabled: true
        avroRecordType: SPECIFIC_RECORD

        dataFormat: AVRO

        enable.idempotence: true

        linger.ms: 5
        batch.size: 65536
        compression.type: snappy

        request.timeout.ms: 30000
        delivery.timeout.ms: 60000
        retry.backoff.ms: 500
        max.in.flight.requests.per.connection: 5
    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: PLAIN
      sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="${SPRING_KAFKA_API_KEY}" password="${SPRING_KAFKA_API_SECRET}";

    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
logging:
  structured:
    format:
      console: logstash