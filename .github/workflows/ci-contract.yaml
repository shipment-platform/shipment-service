name: Deploy OpenAPI Contract

on:
  push:
    branches: [main]
    paths:
      - 'shipment-api-contract/pom.xml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}

      - name: Deploy contract module
        run: ./mvnw deploy -pl shipment-api-contract
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
