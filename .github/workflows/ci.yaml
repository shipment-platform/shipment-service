name: Shipment System CI/CD

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - main

jobs:

  build-test:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}

      - name: Validate
        run: mvn validate

      - name: Compile
        run: mvn compile

      - name: Run tests
        run: mvn test

      - name: Package
        run: mvn package -DskipTests

  publish-shipment-api-contract-module:

    needs: build-test

    # publish only from main
    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Publish shipment-api-contract
        run: mvn deploy -pl shipment-api-contract -N
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}